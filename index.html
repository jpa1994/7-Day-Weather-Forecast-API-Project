<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <title>7 Day Weather Forecast</title>
</head>
<body class="color">
    <svg class="line" height="20" width="100%" xmlns="http://www.w3.org/2000/svg">
        <line id="movingLine" x1="0" y1="10" x2="2000" y2="10" style="stroke:#ffb521;stroke-width:6" />
    </svg> 
<div class="color">
    

    <header role="banner-title">
        <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    <h1>7 Day Weather Forecast</h1>
                </div>
            </div>
        </div>
    </header>
    <header class="sticky" role="banner-city">
        <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    <h3 class="card-title cityState sticky"></h3>
                </div>
            </div>
            <div class="row">
                <!--Search Bar-->
                <div class="topnav text-center sticky" role="nav">
                    <div class="search-container">
                        <form id="searchBar">
                            <input type="text" id="userInput" placeholder="Latitude(y),Longitude(x)" name="search">
                            <button type="submit" class="sButton"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="#fff" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5A6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5S14 7.01 14 9.5S11.99 14 9.5 14"/></svg><i class="fa fa-search"></i></button>
                        </form>
                    </div>
                </div>
                <!---->
            </div>
        </div>
    </header>

    

    <main role="main">
        <!--Template to clone. Template does not appear on page-->
        <template id="cardTemplate">
            <div class="card fullCard mb-3">
                <div class="row g-0">
                    <div class="col-md-4 imgBgd text-center">
                    <img src="https://placehold.co/600x400/png" class="img-fluid rounded-start rounded-end" alt="...">
                </div>
                <div class="col-md-8 textBgd">
                    <div class="card-body">
                        <p class="card-text dayOfWeek mb-2">Day of the Week</p>
                        <p class="card-text fullDate mb-2"></p>
                        <p class="card-text temp mb-2">Tempuratures</p>
                        <p class="card-text cloudsAndRain">Cloudy/Sunny/Rain/Light Rain, etc</p>
                        <div class="accordion" id="accordionTemplate">
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                <button class="accordion-button collapsed accButton" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTemplate" aria-expanded="false" aria-controls="collapseTemplate">
                                    Detailed Forecast</button>
                                </h2>
                                <div id="collapseTemplate" class="accordion-collapse collapse" data-bs-parent="#accordionTemplate">
                                <div class="accordion-body">
                                    <p class="card-text description"><small class="text-body-secondary descSmall">hxkgkm</small></p>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                </div>
                </div>
            </div>
        </template>
        <!---->


        <div class="card-container"></div>

    </main>




    <script src="./JS/app.js"></script>
</div>
</body>
</html>
